<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 1200px;
            margin: auto;
        }

        form {
            padding: 1rem;
        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
            max-width: 1200px;
            margin: auto;

            a {
                text-decoration: none;
                color: inherit;
                display: flex;
                flex-direction: column;
            }
        }

        article {
            background-color: #ded;
            border-radius: 5rem 0;

            img {
                float: left;
                margin-right: 1rem;
                filter: grayscale(.8);
            }
        }

        article:hover {
            filter: drop-shadow(grey 3px 3px 8px);
            translate: -3px;

            img {
                filter: grayscale(0);
            }
        }

        article:active {
            translate: 0px;
            filter: drop-shadow(0px 0px 0px);

        }

        nav {
            padding: 1rem 0;
        }

        .male {
            background-color: #dee;
        }
    </style>
</head>

<body>
    <h1>Members</h1>
    <nav id="filter-nav">
        <button data-all="all">All</button>
        <button data-gender="female">Female</button>
        <button data-gender="male">Male</button>
        <button data-role="user">User</button>
        <button data-role="admin">Admmin</button>
    </nav>
    <nav id="sort-nav">
        <button data-sort="gender">Sorter efter køn</button>
        <button data-sort="role">Sorter efter rolle</button>
        <button data-sort="firstName">Sorter efter fornavn</button>
    </nav>
    <h2>All</h2>
    <main>
    </main>
    <script>
        window.addEventListener("load", hentData);
        document.querySelectorAll("#filter-nav button").forEach(knap => knap.addEventListener("click", filtrer));
        document.querySelectorAll("#sort-nav button").forEach(knap => knap.addEventListener("click", soter));

        const endpoint = "https://dummyjson.com/users";
        const filterHeader = document.querySelector("h2");

        let allData;

        function hentData() {
            fetch(endpoint).then(res => res.json()).then(data => allData = data).then(data => visListe(data.users));
        }

        function visListe(data) {
            const markup = data.map((user) => (
                `<a href="profile.html?id=${user.id}"><article class="${user.gender}">
                <img src="https://randomuser.me/api/portraits/${user.gender == "female" ? "women" : "men"}/${user.id}.jpg" alt="profile image">
                <h2>${user.firstName} ${user.lastName}</h2>
                <p>${user.phone}</p>
                <p>${user.role}</p>
            </article></a>`
            )).join('');
            document.querySelector("main").innerHTML = markup;
        }

        function filtrer() {
            let filtreretData = allData.users;
            if (this.dataset.gender) {
                filtreretData = allData.users.filter(elm => elm.gender == this.dataset.gender);
                filterHeader.textContent = this.dataset.gender;
            } else if (this.dataset.role) {
                filtreretData = allData.users.filter(elm => elm.role == this.dataset.role);
                filterHeader.textContent = this.dataset.role;
            } else {
                filterHeader.textContent = "All";
            }
            visListe(filtreretData);
        }

        function sorter() {
            if (this.dataset.sort == "gender") {
                filtreretData = allData.users.toSorted((a, b) => a.gender.localeCompare(b.gender));
                filterHeader.textContent = this.dataset.sort;
            } else if (this.dataset.sort == "role") {
                filtreretData = allData.users.toSorted((a, b) => a.role.localeCompare(b.role));
                filterHeader.textContent = this.dataset.sort;
            } else if (this.dataset.sort == "firstName") {
                filtreretData = allData.users.toSorted((a, b) => a.firstName.localeCompare(b.firstName));
                filterHeader.textContent = this.dataset.sort;
            }
    </script>
</body>

</html>
