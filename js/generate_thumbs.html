<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 1200px;
            margin: auto;
        }

        form {
            padding: 1rem;
        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
            max-width: 1200px;
            margin: auto;
        }

        article {
            background-color: #ede;

            img {
                float: left;
                margin-right: 1rem;
            }
        }
    </style>
</head>

<body>
    <h1>Medlemsliste</h1>
    <main>
    </main>
    <script>
        window.addEventListener("load", hentData);

        const endpoint = "https://dummyjson.com/users";

        function hentData() {
            fetch(endpoint).then(res => res.json()).then(visListe);
        }

        function visListe(data) {
            const markup = data.users.map((user, i) => (
                `<article>
                <img src="https://randomuser.me/api/portraits/${user.gender == "female" ? "women" : "men"}/${i}.jpg" alt="profile image">
                <h2>${user.firstName} ${user.lastName}</h2>
                <p>${user.phone}</p>
            </article>`
            )).join('');
            document.querySelector("main").innerHTML = markup;
            console.log(data.users);
        }
    </script>
</body>

</html>
