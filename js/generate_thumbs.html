<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        form {
            padding: 1rem;
        }
    </style>
</head>

<body>
    <form action="none">
        <label for="antal">Choose number of images:</label>
        <input type="number" id="antal" value="10">
        <label for="gender">Choose a gender:</label>
        <select name="gender" id="gender">
            <option value="women">Women</option>
            <option value="men">Men</option>
        </select>
        <input type="submit" value="Generate thumbs">
    </form>
    <main>
    </main>
    <script>
        window.addEventListener("load", () => genIamges("women", 20));

        function genIamges(gender, number) {
            let markup = "";
            for (let i = 0; i < number; i++) {
                const img = `https://randomuser.me/api/portraits/${gender}/${i}.jpg`
                markup += `<img src="${img}" alt="thumbnail">`
            }
            document.querySelector("main").innerHTML = markup;
        }

        document.querySelector("form").addEventListener("submit", (e) => {
            e.preventDefault();
            const antal = document.querySelector("#antal").value;
            const gender = document.querySelector("#gender").value;
            genIamges(gender, antal);
        });
    </script>
</body>

</html>
