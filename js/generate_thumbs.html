<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 1200px;
            margin: auto;
        }

        h2 {
            text-transform: capitalize;
        }

        form {
            padding: 1rem;
        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
            max-width: 1200px;
            margin: auto;

            a {
                text-decoration: none;
                color: inherit;
                display: flex;
                flex-direction: column;
            }
        }

        article {
            position: relative;
            background-color: #ded;
            border-radius: 4rem 0;

            img {
                float: left;
                margin-right: 1rem;
                border-radius: 4rem 0;
                height: 100%;
            }
        }

        article:hover {
            filter: drop-shadow(grey 3px 3px 8px) sepia(50%);
            translate: -3px;
        }

        article:active {
            translate: 0px;
            filter: drop-shadow(0px 0px 0px);

        }

        nav {
            padding: 1rem 0;
        }

        .male {
            background-color: #dee;
        }

        .admin {
            background-color: #dee;
        }

        .moderator {
            background-color: #ede;
        }
    </style>
</head>

<body>
    <h1>Members</h1>
    <nav id="filter-nav">
        <button data-all="all">All</button>
        <button data-gender="female">Women</button>
        <button data-gender="male">Men</button>
        <button data-role="user">Users</button>
        <button data-role="admin">Admmins</button>
        <button data-role="moderator">Moderators</button>
    </nav>
    <nav id="sort-nav">
        <button data-sort="gender">Sorter efter køn</button>
        <button data-sort="role">Sorter efter rolle</button>
        <button data-sort="firstName">Sorter efter fornavn</button>
        <button data-sort="lastName">Sorter efter efternavn</button>
        <button data-sort="age">Sorter efter alder</button>
        <button data-sort="height">Sorter efter højde</button>
    </nav>
    <h2>All</h2>
    <main>
    </main>
    <script>
        window.addEventListener("load", hentData);
        document.querySelectorAll("#filter-nav button").forEach(knap => knap.addEventListener("click", filtrer));
        document.querySelectorAll("#sort-nav button").forEach(knap => knap.addEventListener("click", sorter));

        const endpoint = "https://dummyjson.com/users";
        const filterHeader = document.querySelector("h2");

        let allData, filtreretData, filter = "all";

        function hentData() {
            fetch(endpoint)
                .then(res => res.json())
                .then(data => {
                    console.log(data.users[0]);
                    allData = data;
                    filtreretData = data.users;
                    visListe(data.users);
                });
        }

        function visListe(data) {
            const markup = data.map((user) => (
                `<a href="profile.html?id=${user.id}">
                    <article class="${user.role}">
                    <img src="https://randomuser.me/api/portraits/${user.gender == "female" ? "women" : "men"}/${user.id}.jpg" alt="profile image">
                    <h2>${user.firstName} ${user.lastName}</h2>
                    <p>${user.role} (${user.gender})</p>
                    <p>${user.age}y ${user.height}cm</p>
                    </article></a>`
            )).join('');
            document.querySelector("main").innerHTML = markup;
        }

        function filtrer() {
            if (this.dataset.gender) {
                filter = this.dataset.gender;
                filtreretData = allData.users.filter(elm => elm.gender == filter);
            } else if (this.dataset.role) {
                filter = this.dataset.role;
                filtreretData = allData.users.filter(elm => elm.role == filter);
            } else {
                filter = "all";
                filtreretData = allData.users;
            }
            filterHeader.textContent = filter;
            visListe(filtreretData);
        }

        function sorter() {
            const criteria = this.dataset.sort;
            if (criteria === "age" || criteria === "height") {
                sortedData = filtreretData.toSorted((a, b) => a[criteria] - (b[criteria]));
            } else {
                sortedData = filtreretData.toSorted((a, b) => a[criteria].localeCompare(b[criteria]));
            }
            filterHeader.textContent = filter + " sorted by " + criteria;
            visListe(sortedData);
        }
    </script>
</body>

</html>
