<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 1200px;
            margin: auto;
        }

        form {
            padding: 1rem;
        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
            max-width: 1200px;
            margin: auto;

            a {
                text-decoration: none;
                color: inherit;
                display: flex;
                flex-direction: column;
            }
        }

        article {
            background-color: #ded;
            border-radius: 5rem 0;

            img {
                float: left;
                margin-right: 1rem;
                filter: grayscale(.8);
            }
        }

        article:hover {
            filter: drop-shadow(grey 3px 3px 8px);
            translate: -3px;

            img {
                filter: grayscale(0);
            }
        }

        article:active {
            translate: 0px;
            filter: drop-shadow(0px 0px 0px);

        }

        nav {
            padding: 1rem 0;
        }

        .male {
            background-color: #dee;
        }
    </style>
</head>

<body>
    <h1>Members</h1>
    <select>
        <option value="all">All</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="user">User</option>
        <option value="moderator">Moderator</option>
        <option value="admin">Admmin</option>
    </select>
    <h2>All</h2>
    <main>
    </main>
    <script>
        window.addEventListener("load", hentData);
        document.querySelector("select").addEventListener("change", filtrer)

        const endpoint = "https://dummyjson.com/users";
        const filterHeader = document.querySelector("h2");

        let allData, filtreretData;

        function hentData() {
            fetch(endpoint).then(res => res.json()).then(data => allData = data).then(data => visListe(data.users));
        }

        function visListe(data) {
            const markup = data.map((user, i) => (
                `<a href="profile.html?id=${user.id}"><article class="${user.gender}">
                <img src="https://randomuser.me/api/portraits/${user.gender == "female" ? "women" : "men"}/${user.id}.jpg" alt="profile image">
                <h2>${user.firstName} ${user.lastName}</h2>
                <p>${user.phone}</p>
            </article></a>`
            )).join('');
            document.querySelector("main").innerHTML = markup;
        }

        function filtrer(e) {
            if (e.target.value == "all") {
                filtreretData = allData.users;
                filterHeader.textContent = "All";
            } else if (e.target.value == "female") {
                filtreretData = allData.users.filter(elm => elm.gender == "female");
                filterHeader.textContent = "Female";
            } else if (e.target.value == "male") {
                filtreretData = allData.users.filter(elm => elm.gender == "male");
                filterHeader.textContent = "Male";
            } else if (e.target.value == "user") {
                filtreretData = allData.users.filter(elm => elm.role == "user");
                filterHeader.textContent = "User";
            } else if (e.target.value == "admin") {
                filtreretData = allData.users.filter(elm => elm.role == "admin");
                filterHeader.textContent = "Admin";
            } else if (e.target.value == "moderator") {
                filtreretData = allData.users.filter(elm => elm.role == "moderator");
                filterHeader.textContent = "moderator";
            }
            visListe(filtreretData);
        }
    </script>
</body>

</html>
